name = "beacon-ridge-cms-oauth"
main = "worker.js"
compatibility_date = "2026-10-29"

# Binds this Worker to cms-auth.premium.mhtsdigixr.com as a Custom Domain
# (requires mhtsdigixr.com's zone to be on this same Cloudflare account —
# it is). `wrangler deploy` creates the DNS record and the binding together.
routes = [
  { pattern = "cms-auth.premium.mhtsdigixr.com", custom_domain = true }
]
